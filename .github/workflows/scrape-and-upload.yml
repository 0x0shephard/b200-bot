name: Scrape B200 Prices and Upload to Supabase & ByteStrike CuOracle

on:
  # Run manually via workflow dispatch
  workflow_dispatch:

  # Run frequently enough to keep the 1 hour CuOracleAdapter maxAge fresh.
  schedule:
    - cron: '*/30 * * * *'

  # Run on push to main branches (optional - remove if not needed)
  push:
    branches:
      - master
      - update1

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies for Selenium
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Set up ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all scrapers
        run: |
          echo "🚀 Running all B200 scrapers..."
          python run_all_scrapers.py
        continue-on-error: false

      - name: Run GetDeploying B200 scraper
        run: |
          echo "🔍 Running GetDeploying B200 scraper..."
          python getdeploying_b200_scraper.py
        continue-on-error: false

      - name: Calculate weighted index
        run: |
          echo "📊 Calculating B200 weighted index..."
          python calculate_b200_index.py
        continue-on-error: false

      - name: Verify scraper outputs
        run: |
          echo "📊 Checking generated JSON files..."
          ls -lh *_b200_prices.json 2>/dev/null || echo "⚠️  No price files found"

          if [ -f "b200_normalized_prices.json" ]; then
            echo "✅ Normalized prices file exists"
          else
            echo "❌ Normalized prices file missing"
          fi

          if [ -f "b200_weighted_index.json" ]; then
            echo "✅ Weighted index file exists"
            cat b200_weighted_index.json | python -m json.tool | head -20
          else
            echo "❌ Weighted index file missing"
          fi

      - name: Push to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "📤 Pushing data to Supabase..."
          python push_to_supabase.py

      - name: Push B200 index to ByteStrike CuOracle
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          SEPOLIA_FALLBACK_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
          ORACLE_UPDATER_PRIVATE_KEY: ${{ secrets.ORACLE_UPDATER_PRIVATE_KEY }}
          CU_ORACLE_ADDRESS: ${{ secrets.CU_ORACLE_ADDRESS }}
          ORACLE_REVEAL_WAIT_SECONDS: "3"
        run: |
          echo "⛓️  Pushing B200 index to ByteStrike CuOracle..."

          # Extract the weighted index price from the JSON file
          PRICE=$(python -c "import json; data=json.load(open('b200_weighted_index.json')); print(data['final_index_price'])")

          echo "💰 B200 Weighted Index Price: \$${PRICE}/hr"
          echo "📤 Committing and revealing on-chain oracle price..."

          python update_to_oracle.py "$PRICE"

      - name: Push Oracle and AWS B200 provider prices to ByteStrike CuOracle
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          SEPOLIA_FALLBACK_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
          ORACLE_UPDATER_PRIVATE_KEY: ${{ secrets.ORACLE_UPDATER_PRIVATE_KEY }}
          CU_ORACLE_ADDRESS: ${{ secrets.CU_ORACLE_ADDRESS }}
          ORACLE_REVEAL_WAIT_SECONDS: "3"
        run: |
          echo "⛓️  Pushing Oracle and AWS B200 provider prices to ByteStrike CuOracle..."
          python update_to_oracle_single.py

      - name: Push CoreWeave and GCP B200 provider prices to ByteStrike CuOracle
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          SEPOLIA_FALLBACK_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
          ORACLE_UPDATER_PRIVATE_KEY: ${{ secrets.ORACLE_UPDATER_PRIVATE_KEY }}
          CU_ORACLE_ADDRESS: ${{ secrets.CU_ORACLE_ADDRESS }}
          ORACLE_REVEAL_WAIT_SECONDS: "3"
        run: |
          echo "⛓️  Pushing CoreWeave and GCP B200 provider prices to ByteStrike CuOracle..."
          python update_to_oracle_single_part2.py

      - name: Upload artifacts (optional - for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b200-pricing-data-${{ github.run_number }}
          path: |
            *_b200_prices.json
            b200_normalized_prices.json
            b200_weighted_index.json
            b200_oracle_update_log.json
            b200_provider_price_updates.json
          retention-days: 7

      - name: Summary
        if: success()
        run: |
          echo "✅ Workflow completed successfully!"
          echo "📊 Data has been scraped and uploaded to Supabase & ByteStrike CuOracle"

          if [ -f "b200_weighted_index.json" ]; then
            INDEX_PRICE=$(python -c "import json; data=json.load(open('b200_weighted_index.json')); print(f\"\${data['final_index_price']:.2f}\")")
            echo "💰 Current B200 Weighted Index: $INDEX_PRICE/hr"
          fi

          if [ -f "b200_oracle_update_log.json" ]; then
            echo "📝 B200 Oracle update log created"
          fi

          if [ -f "b200_provider_price_updates.json" ]; then
            echo "📝 B200 provider prices updated on ByteStrike CuOracle"
          fi
